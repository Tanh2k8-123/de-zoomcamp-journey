id: python_dockerhub
namespace: de_zoomcamp_2027

description: Query Docker Hub for Kestra image pull count using Python.

tasks:
  - id: collect_stats
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:slim
    dependencies:
      - requests
      - kestra
    script: |
      from kestra import Kestra
      import requests

      def get_docker_image_downloads(image_name: str = "kestra/kestra"):
          url = f"https://hub.docker.com/v2/repositories/{image_name}/"
          response = requests.get(url)
          data = response.json()
          downloads = data.get("pull_count", "Not available")
          return downloads

      downloads = get_docker_image_downloads()
      outputs = {
          "downloads": downloads
      }
      Kestra.outputs(outputs)

  - id: show_result
    type: io.kestra.plugin.core.log.Log
    message: "DockerHub downloads: {{ outputs.collect_stats.vars.downloads }}"